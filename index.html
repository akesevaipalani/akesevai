  <!-- Instant Dark Mode Theme & Clean URL Pre-loader -->
  <script>
    (function () {
      try {
        var storedDark = localStorage.getItem('akesevai-dark-mode');
        if (storedDark === null) {
          var match = document.cookie.match(/akesevai-dark-mode=(true|false)/);
          if (match) storedDark = match[1];
        }
        if (storedDark === 'true') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        if (window.location.hash) {
          var cleanUrl = window.location.protocol + '//' + window.location.host + window.location.pathname + window.location.search;
          window.history.replaceState(null, '', cleanUrl);
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) { r.unregister(); }
          });
        }
      } catch (e) { }
    })();
  </script>
